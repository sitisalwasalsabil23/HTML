<!DOCTYPE html>
<html>
<head>
    <title>Variabel dan Operator</title>
</head>
<body>
    <h2>Perhitungan Nilai</h2>
    <p id="hasil"></p>

    <script>
        let nilaiTugas = 80;
        let nilaiUjian = 90;
        let rataRata = (nilaiTugas + nilaiUjian) / 2;

        document.getElementById("hasil").textContent = 
            "Nilai rata-rata: " + rataRata;
    </script>
</body>
</html>
