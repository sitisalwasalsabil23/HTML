<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Media Pembelajaran</title>
</head>
<body>
    <h1>Media Pembelajaran Pemrograman Web</h1>
    
    <h2>Gambar</h2>
    <img src="gambar hijau.jpeg" alt="Ilustrasi pembelajaran pemrograman web" width="400">

    <h2>Video</h2>
    <video width="400" controls>
        <source src="TULUS.mp4" type="video/mp4">
        Browser tidak mendukung video.
    </video>
    
    <h2>Konten Eksternal</h2>
    <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=119.38%2C-5.18%2C119.48%2C-5.10&layer=mapnik" 
            width="500" 
            height="300" 
            title="Peta Kota Makassar">
    </iframe>
    
    <h2>FAQ</h2>
    <details>
        <summary>Apa itu HTML?</summary>
        <p>HTML adalah bahasa markup yang digunakan untuk menyusun struktur halaman web.</p>
    </details>
    <details>
        <summary>Apa fungsi CSS?</summary>
        <p>CSS digunakan untuk mengatur tampilan halaman web.</p>
    </details>
</body>
</html>
