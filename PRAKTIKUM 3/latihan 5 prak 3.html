<!DOCTYPE html>
<html>
<head>
    <title>Data Mahasiswa</title>
    <link rel="stylesheet" href="csslatihan5.css">
</head>
<body>
    <h1>Data Mahasiswa</h1>

    <div class="card-container">
        <div class="card">
            <h3>1. Daftar Mata Kuliah</h3>
        </div>
        <div class="card">
            <h3>2. Nilai Mahasiswa</h3>
        </div>
        <div class="card">
            <h3>3. Jadwal Kuliah</h3>
        </div>
    </div>

    <h3>Form Data Mahasiswa</h3>
    <form>
        <label for="nama">Nama</label>
        <input type="text" id="nama" placeholder="Masukkan nama">

        <label for="nim">NIM</label>
        <input type="text" id="nim" placeholder="Masukkan NIM">

        <label for="prodi">Program Studi</label>
        <select id="prodi">
            <option>Teknik Komputer</option>
            <option>PTIK</option>
        </select>

        <label for="alamat">Alamat</label>
        <textarea id="alamat" placeholder="Masukkan alamat"></textarea>

        <button type="submit">Simpan</button>
    </form>
</body>
</html>
