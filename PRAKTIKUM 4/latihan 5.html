<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 5 - Formulir Bootstrap</title>
    <!-- CSS Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Formulir Pendaftaran Praktikum</h4>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <!-- Input Nama Lengkap -->
                            <div class="mb-3">
                                <label for="nama" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap" required>
                            </div>

                            <!-- Input NIM -->
                            <div class="mb-3">
                                <label for="nim" class="form-label">NIM (Nomor Induk Mahasiswa)</label>
                                <input type="text" class="form-control" id="nim" placeholder="Contoh: 220209500001" required>
                            </div>

                            <!-- Select Program Studi -->
                            <div class="mb-3">
                                <label for="prodi" class="form-label">Program Studi</label>
                                <select class="form-select" id="prodi" required>
                                    <option value="" selected disabled>-- Pilih Program Studi --</option>
                                    <option value="PTIK">Pendidikan Teknik Informatika dan Komputer</option>
                                    <option value="TE">Teknik Elektro</option>
                                </select>
                            </div>

                            <!-- Radio Button Jenis Kelamin -->
                            <div class="mb-3">
                                <label class="form-label d-block">Jenis Kelamin</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="jk" id="jkL" value="Laki-laki" checked>
                                    <label class="form-check-label" for="jkL">Laki-laki</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="jk" id="jkP" value="Perempuan">
                                    <label class="form-check-label" for="jkP">Perempuan</label>
                                </div>
                            </div>

                            <!-- Textarea Alasan / Pesan -->
                            <div class="mb-3">
                                <label for="alasan" class="form-label">Alasan Mengikuti Praktikum</label>
                                <textarea class="form-control" id="alasan" rows="3" placeholder="Tuliskan motivasi Anda..."></textarea>
                            </div>

                            <!-- Checkbox Persetujuan -->
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="persetujuan" required>
                                <label class="form-check-label" for="persetujuan">Saya menyetujui syarat dan ketentuan yang berlaku.</label>
                            </div>

                            <!-- Tombol Submit & Reset -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="reset" class="btn btn-outline-secondary me-md-2">Reset</button>
                                <button type="submit" class="btn btn-primary">Kirim Pendaftaran</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Bootstrap via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
